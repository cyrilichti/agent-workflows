# Copy this file to `agent-workflows.yaml` in a consuming project.
# Provider access is configured in the agent's execution environment:
# ClickUp uses clickup-cli, Linear uses schpet/linear-cli, and GitHub/GitLab use gh/glab.
# The historical `mcp` keys select providers; they do not prescribe transport.

mcp:
  item:
    provider: clickup

  # Supported values: github, gitlab
  version:
    provider: gitlab
