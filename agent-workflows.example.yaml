# Copy this file to `agent-workflows.yaml` in a consuming project when workflows need
# project-specific MCP providers.
#
# MCP server endpoints are configured by each AI tool, not in this file.
# This file only tells Agentic Engineering which MCP provider to use for each
# provider context.

mcp:
  item:
    provider: clickup

  # Examples:
  #
  # review:
  #   provider: gitlab
