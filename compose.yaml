name: agent-workflows
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3001
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
x-depends: &langfuse-depends
  postgres: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
services:
  kestra-db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
    volumes: [kestra-db:/var/lib/postgresql/data]
    networks: [workflow]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kestra -d kestra']
      interval: 5s
      timeout: 5s
      retries: 20
  kestra:
    build:
      context: ./.docker/kestra
    restart: unless-stopped
    command: server standalone --worker-thread=4
    stop_grace_period: 2m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      kestra-db: {condition: service_healthy}
    ports: ['127.0.0.1:3000:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
      KESTRA_ADMIN_EMAIL: ${KESTRA_ADMIN_EMAIL:-local@example.test}
      KESTRA_ADMIN_PASSWORD: ${KESTRA_ADMIN_PASSWORD:?Set KESTRA_ADMIN_PASSWORD in .env}
      SECRET_BRIDGE_TOKEN: ${SECRET_BRIDGE_TOKEN:?Set SECRET_BRIDGE_TOKEN in .env}
      ENV_BRIDGE_URL: ${BRIDGE_URL:-http://host.docker.internal:8787}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: $${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: $${KESTRA_ADMIN_EMAIL}
              password: $${KESTRA_ADMIN_PASSWORD}
          repository:
            type: postgres
          queue:
            type: postgres
          tutorial-flows:
            enabled: false
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra
          url: http://localhost:3000/
          anonymous-usage-report:
            enabled: false
    volumes: [kestra:/app/storage]
    networks: [workflow]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8081/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
  workflow-init:
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    working_dir: /app
    command: ['node', 'src/install.mjs']
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      kestra: {condition: service_healthy}
    environment:
      KESTRA_URL: http://kestra:8080
      KESTRA_ADMIN_EMAIL: ${KESTRA_ADMIN_EMAIL:-local@example.test}
      KESTRA_ADMIN_PASSWORD: ${KESTRA_ADMIN_PASSWORD:?Set KESTRA_ADMIN_PASSWORD in .env}
    volumes:
      - ./src/install.mjs:/app/src/install.mjs:ro
      - ./orchestration/work.yaml:/app/orchestration/work.yaml:ro
    networks: [workflow]
  langfuse-web:
    image: langfuse/langfuse:4.48.0@sha256:8c1b80ed7735be587974d603af0f6e0247b33d3b56c7d5ab9d2337aec313efa0
    restart: unless-stopped
    depends_on: *langfuse-depends
    ports: ['127.0.0.1:3001:3000']
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: Local AI
      LANGFUSE_INIT_PROJECT_ID: local-ai
      LANGFUSE_INIT_PROJECT_NAME: Local AI workflow
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-local@example.test}
      LANGFUSE_INIT_USER_NAME: Local user
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?Set LANGFUSE_ADMIN_PASSWORD in .env}
    networks: [observability, storage]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
  langfuse-worker:
    image: langfuse/langfuse-worker:4.48.0@sha256:9349b003a453326b3d2e2033eb94fe5ca9ee12ee237779c10984b9d3dfe0f8ed
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment: *langfuse-env
    networks: [storage]
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: langfuse
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [storage]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d langfuse']
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    volumes: [clickhouse:/var/lib/clickhouse, clickhouse-logs:/var/log/clickhouse-server]
    networks: [storage]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2.6-bookworm@sha256:43c5c111b5b63afce26faea67198f8cf7e63b941460bcfe1525b68a6ad1eef92
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    environment: {REDISCLI_AUTH: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}'}
    volumes: [redis:/data]
    networks: [storage]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    restart: unless-stopped
    entrypoint: /bin/sh
    command: ['-c', 'mkdir -p /data/langfuse && minio server --address :9000 /data']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    volumes: [minio:/data]
    networks: [storage]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  workflow: {}
  observability: {}
  storage: {internal: true}
volumes:
  kestra-db: {}
  kestra: {}
  postgres:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_postgres
  clickhouse:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_clickhouse
  clickhouse-logs:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_clickhouse-logs
  redis:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_redis
  minio:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_minio
