name: agent-workflows
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3001
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
x-depends: &langfuse-depends
  postgres: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
x-bridge: &bridge
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: ['/tmp:uid=1000,gid=1000,mode=700']
  environment: &bridge-env
    AI_MODEL: ${AI_MODEL:-gpt-6-luna}
    INFERENCE_ENABLED: ${INFERENCE_ENABLED:-false}
    REQUEST_TIMEOUT_MS: 90000
    LANGFUSE_URL: http://langfuse-web:3000
    LANGFUSE_PUBLIC_URL: http://localhost:3001
    LANGFUSE_PROJECT_ID: local-ai
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
    DATA_DIR: /data
  volumes: [bridge:/data]
  networks:
    workflow: {ipv4_address: 172.30.81.10, aliases: [bridge]}
    observability: {}
  healthcheck:
    test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 10
services:
  flowise-volume-init:
    image: flowiseai/flowise:3.1.4@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    user: '0:0'
    network_mode: none
    entrypoint: ['/bin/sh', '-c']
    command: ['chown -R 1000:1000 /data']
    volumes: [flowise:/data]
    restart: 'no'
  flowise-db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowise
      POSTGRES_PASSWORD: ${FLOWISE_DB_PASSWORD:?Set FLOWISE_DB_PASSWORD in .env}
    volumes: [flowise-db:/var/lib/postgresql/data]
    networks: [workflow]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flowise']
      interval: 5s
      timeout: 5s
      retries: 20
  flowise:
    image: flowiseai/flowise:3.1.4@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    restart: unless-stopped
    depends_on:
      flowise-volume-init: {condition: service_completed_successfully}
      flowise-db: {condition: service_healthy}
    ports: ['127.0.0.1:3000:3000']
    environment:
      PORT: 3000
      DATABASE_TYPE: postgres
      DATABASE_HOST: flowise-db
      DATABASE_PORT: 5432
      DATABASE_NAME: flowise
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${FLOWISE_DB_PASSWORD:?Set FLOWISE_DB_PASSWORD in .env}
      APIKEY_PATH: /home/node/.flowise
      SECRETKEY_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
      JWT_AUTH_TOKEN_SECRET: ${FLOWISE_JWT_SECRET:?Set FLOWISE_JWT_SECRET in .env}
      JWT_REFRESH_TOKEN_SECRET: ${FLOWISE_REFRESH_SECRET:?Set FLOWISE_REFRESH_SECRET in .env}
      EXPRESS_SESSION_SECRET: ${FLOWISE_SESSION_SECRET:?Set FLOWISE_SESSION_SECRET in .env}
      TOKEN_HASH_SECRET: ${FLOWISE_HASH_SECRET:?Set FLOWISE_HASH_SECRET in .env}
      DISABLE_FLOWISE_TELEMETRY: 'true'
      # Same upstream deny policy, except the one private bridge IP.
      HTTP_SECURITY_CHECK: 'false'
      HTTP_DENY_LIST: 0.0.0.0,10.0.0.0/8,127.0.0.0/8,169.254.0.0/16,192.168.0.0/16,224.0.0.0/4,240.0.0.0/4,255.255.255.255/32,::1,fc00::/7,fe80::/10,ff00::/8,localhost,ip6-localhost,172.16.0.0/13,172.24.0.0/14,172.28.0.0/15,172.31.0.0/16,172.30.128.0/17,172.30.0.0/18,172.30.96.0/19,172.30.64.0/20,172.30.88.0/21,172.30.84.0/22,172.30.82.0/23,172.30.80.0/24,172.30.81.128/25,172.30.81.64/26,172.30.81.32/27,172.30.81.16/28,172.30.81.0/29,172.30.81.12/30,172.30.81.8/31,172.30.81.11/32
    volumes: [flowise:/home/node/.flowise]
    networks: [workflow]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
  workflow-init:
    build:
      context: ./.docker
      dockerfile: Dockerfile.init
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      flowise: {condition: service_healthy}
    environment:
      FLOWISE_URL: http://flowise:3000
      FLOWISE_ADMIN_EMAIL: ${FLOWISE_ADMIN_EMAIL:-local@example.test}
      FLOWISE_ADMIN_PASSWORD: ${FLOWISE_ADMIN_PASSWORD:?Set FLOWISE_ADMIN_PASSWORD in .env}
    volumes: [flowise:/state]
    networks: [workflow]
  bridge:
    <<: *bridge
    profiles: [codex]
    build: {context: ./.docker/bridge, target: codex}
    environment:
      <<: *bridge-env
      AI_PROVIDER: codex
      CODEX_WORKSPACE_ID: ${CODEX_WORKSPACE_ID:-}
      CODEX_HOME: /auth
    volumes: [bridge:/data, codex-auth:/auth]
  bridge-api:
    <<: *bridge
    profiles: [openai-api]
    build: {context: ./.docker/bridge, target: api}
    environment:
      <<: *bridge-env
      AI_PROVIDER: openai-api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  langfuse-web:
    image: langfuse/langfuse:4.48.0@sha256:8c1b80ed7735be587974d603af0f6e0247b33d3b56c7d5ab9d2337aec313efa0
    restart: unless-stopped
    depends_on: *langfuse-depends
    ports: ['127.0.0.1:3001:3000']
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: Local AI
      LANGFUSE_INIT_PROJECT_ID: local-ai
      LANGFUSE_INIT_PROJECT_NAME: Local AI workflow
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: local@example.test
      LANGFUSE_INIT_USER_NAME: Local user
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?Set LANGFUSE_ADMIN_PASSWORD in .env}
    networks: [observability, storage]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
  langfuse-worker:
    image: langfuse/langfuse-worker:4.48.0@sha256:9349b003a453326b3d2e2033eb94fe5ca9ee12ee237779c10984b9d3dfe0f8ed
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment: *langfuse-env
    networks: [storage]
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: langfuse
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [storage]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d langfuse']
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    volumes: [clickhouse:/var/lib/clickhouse, clickhouse-logs:/var/log/clickhouse-server]
    networks: [storage]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2.6-bookworm@sha256:43c5c111b5b63afce26faea67198f8cf7e63b941460bcfe1525b68a6ad1eef92
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    environment: {REDISCLI_AUTH: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}'}
    volumes: [redis:/data]
    networks: [storage]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    restart: unless-stopped
    entrypoint: /bin/sh
    command: ['-c', 'mkdir -p /data/langfuse && minio server --address :9000 /data']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    volumes: [minio:/data]
    networks: [storage]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  workflow:
    ipam:
      config: [{subnet: 172.30.81.0/24}]
  observability: {}
  storage: {internal: true}
volumes:
  flowise-db:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_flowise-db
  flowise:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_flowise
  bridge:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_bridge
  codex-auth:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_codex-auth
  postgres:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_postgres
  clickhouse:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_clickhouse
  clickhouse-logs:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_clickhouse-logs
  redis:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_redis
  minio:
    external: ${EXTERNAL_VOLUMES:-false}
    name: ${VOLUME_PREFIX:-agent-workflows}_minio
