id: work_loop
namespace: agent_workflows
description: Run work cycles sequentially until this controller execution is killed in Kestra. Configure its delay in agent-workflows.yaml.
inputs:
  - id: intervalSeconds
    type: INT
    min: 1
    max: 2147483647
    defaults: "{{ yaml(read('agent-workflows.yaml')).orchestration.workLoop.intervalSeconds | default(300) }}"
concurrency:
  limit: 1
  behavior: FAIL
tasks:
  - id: loop
    type: io.kestra.plugin.core.flow.LoopUntil
    condition: '{{ false }}'
    checkFrequency:
      interval: PT0.001S
    tasks:
      - id: work-cycle
        type: io.kestra.plugin.core.flow.Subflow
        namespace: agent_workflows
        flowId: work
        wait: true
        transmitFailed: false
        allowFailure: true
      - id: cycle-result
        type: io.kestra.plugin.core.log.Log
        message: >-
          Work cycle {{ outputs['work-cycle'].executionId is defined ? outputs['work-cycle'].executionId : 'unavailable (see work-cycle logs)' }} finished with state
          {{ outputs['work-cycle'].state is defined ? outputs['work-cycle'].state : 'ERROR' }}. Inspect the child execution for task logs,
          responses, and trace URLs. The next cycle starts after the configured delay.
      - id: cycle-delay
        type: io.kestra.plugin.core.flow.Sleep
        duration: "PT{{ inputs.intervalSeconds }}S"
