id: work
namespace: agent_workflows
description: |
  ## Continuous work

  Process eligible items **one at a time**. Each cycle:

  1. **Select** an item with `/next`.
  2. **Resolve** its local Git repository with `/project`.
  3. **Deliver and inspect** its approved plan with `/work`, `/ready`, and
     `/inspect`. Readiness gaps and blocking review findings are corrected
     within that delivery before this Kestra cycle ends.
  4. **Wait** for `intervalSeconds`, then start another cycle.

  | Cycle outcome | What happens next |
  | --- | --- |
  | Work completed | Require a successful inspection result for the selected item, then wait. |
  | No eligible item | Skip project resolution and work, then wait. |
  | Error | Keep the failure in Kestra logs, then wait. |

  **Control:** The delay defaults to **300 seconds (five minutes)**. Cycles do
  not overlap; a second concurrent execution is rejected. This flow does not
  merge the request or invoke `/done`: those remain human decisions. **Kill
  this execution in Kestra** to stop the loop.
inputs:
  - id: intervalSeconds
    type: STRING
    description: |
      **Delay between cycles**, in whole seconds. Defaults to `300` (five
      minutes). The next `/next` call starts only after the current cycle and
      this delay have finished.
    validator: '^[1-9][0-9]*$'
    defaults: "300"
concurrency:
  limit: 1
  behavior: FAIL
tasks:
  - id: loop
    type: io.kestra.plugin.core.flow.LoopUntil
    description: |
      **Repeat sequentially:** run `start`, then `sleep`, then start the next
      iteration at `/next`. The condition remains false, so this Kestra
      execution stays open until it is **killed manually**. No new cycle starts
      while the current item is being processed.
    condition: '{{ false }}'
    checkFrequency:
      interval: PT0.001S
    tasks:
      - id: start
        type: io.kestra.plugin.core.flow.AllowFailure
        description: |
          **One attempt:** call `/next`, resolve the selected item's local Git
          repository with `/project`, then call `/work` in that directory.

          - **Success or no item:** finish this attempt and continue to `sleep`.
          - **Failure:** skip the remaining steps of this attempt and retain
            the failure in Kestra logs. `AllowFailure` still lets `sleep` run,
            so the next selection can start after the delay. It does not retry
            a failed step inside the same attempt.
        tasks:
          - id: next
            type: io.kestra.plugin.core.http.Request
            description: |
              **Select the next approved item.** The authenticated bridge runs
              `/next` without an item reference. It reads the Linear or
              ClickUp provider from `agent-workflows.yaml` and makes **one**
              filtered selection query.

              - **ClickUp:** first task in the returned page tagged
                `agent-planned`, excluding closed tasks.
              - **Linear:** first unarchived issue in the returned page with
                the **exact** `agent-planned` label and `Backlog` or `Open`
                status.
              - **Selection order:** first eligible result in the returned
                page. Neither provider query requests creation-time or
                update-time ordering.

              **Result:** exactly `name`, `id`, `url`, and `list` for a match;
              `list` is the Linear project or ClickUp list name. No match
              returns `{"status":"no eligible item"}`. A missing destination
              or provider failure is an error. Selection does not read another
              item, create a plan, change the item, or start delivery.
            uri: '{{ envs.bridge_url }}/generate'
            method: POST
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
            body: >-
              {{ {
                "requestId": execution.id ~ "-next-" ~ uuid(),
                "prompt": "Execute /next",
                "timeoutMs": 285000
              } | toJson }}
            timeout: PT5M
            options:
              timeout:
                connectTimeout: PT5S
                readIdleTimeout: PT4M55S
          - id: has-item
            type: io.kestra.plugin.core.flow.Switch
            description: |
              **Validate the `/next` result before resolving a repository.**

              - **Item:** nonblank `name`, `id`, `url`, and `list` → `project`.
              - **No item:** exact `no eligible item` status → `no-item`;
                skip `/project` and `/work` in this cycle.
              - **Unexpected response:** malformed or unknown content →
                `next-error`.
            value: >-
              {{ outputs.next.body | toJson | jq('
                try (fromjson | .text | fromjson) catch null
                | if . == {"status":"no eligible item"} then "no-item"
                  elif type == "object" and (try (
                    (.name | type) == "string" and (.name | test("\\S"))
                    and (.id | type) == "string" and (.id | test("\\S"))
                    and (.url | type) == "string" and (.url | test("\\S"))
                    and (.list | type) == "string" and (.list | test("\\S"))
                  ) catch false) then "item"
                  else "error"
                  end
              ') | first }}
            cases:
              item:
                - id: project
                  type: io.kestra.plugin.core.http.Request
                  description: |
                    **Resolve one local Git repository** by calling `/project`
                    with the selected item's exact `id` and destination
                    `list`. Both are required; missing or blank values are
                    errors. Search available repositories in this order:

                    1. Configured project paths.
                    2. Repositories beside those paths.
                    3. Repositories under the home directory.

                    **Complete the first matching tier** before choosing, so
                    discovery order does not decide between competing matches.
                    Keep all exact destination matches when any exist;
                    otherwise keep prefix matches. Only for multiple matches,
                    read the complete item to identify its primary repository
                    and apply stable tie breaks if needed.

                    **Result:** one absolute repository `path`, `not found`,
                    or `search incomplete`. Invalid input or a failed search
                    is an error. Never infer a repository from a missing path.
                  uri: '{{ envs.bridge_url }}/generate'
                  method: POST
                  contentType: application/json
                  headers:
                    Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
                  body: >-
                    {{ {
                      "requestId": execution.id ~ "-project-" ~ uuid(),
                      "prompt": "Execute /project with list: " ~ fromJson(fromJson(outputs.next.body).text).list ~ " and item ID: " ~ fromJson(fromJson(outputs.next.body).text).id,
                      "timeoutMs": 285000
                    } | toJson }}
                  timeout: PT5M
                  options:
                    timeout:
                      connectTimeout: PT5S
                      readIdleTimeout: PT4M55S
                - id: has-project
                  type: io.kestra.plugin.core.flow.Switch
                  description: |
                    **Validate the `/project` result before running `/work`.**

                    - **Resolved:** nonblank `path` → `work` in that directory.
                    - **Unresolved:** `not found` or `search incomplete` →
                      `project-required`, with the reason recorded.
                    - **Unexpected response:** missing or invalid fields →
                      `project-error`; never pass an unverified directory.
                  value: >-
                    {{ outputs.project.body | toJson | jq('
                      try (fromjson | .text | fromjson) catch null
                      | if type == "object" and (try (
                          (.path | type) == "string" and (.path | test("\\S"))
                        ) catch false) then "project"
                        elif type == "object" and (try (
                          ((.status == "not found") or (.status == "search incomplete"))
                          and (has("path") | not)
                        ) catch false) then "no-project"
                        else "error"
                        end
                    ') | first }}
                  cases:
                    project:
                      - id: work
                        type: io.kestra.plugin.core.http.Request
                        description: |
                          **Deliver the selected `agent-planned` item** in the
                          repository resolved by `/project`. `/work` executes
                          its approved plan autonomously, one todo at a time.

                          | Stage | Documented behavior |
                          | --- | --- |
                          | Initialize | For new work, move the item to `in progress`, copy its published plan locally, and create a work branch with a linked draft request. If a delivery backlink exists, resume its authoritative local plan and todo states without resetting the item status. |
                          | Route | Select or reuse the most suitable specialist for the active todo. Load only skills triggered by that activity; the specialist may work directly when none apply. |
                          | Execute | Persist the todo as in progress, implement and validate only its scope, then stage only its changes. |
                          | Commit | Commit the result, persist todo completion immediately, and push the commit. A todo without a commit causes **no push**. |
                          | Ready | Once every todo is complete, continue automatically to `/ready` without another approval. |

                          **Readiness and inspection:** `/ready` requires a
                          terminal plan, complete delivery, and one clean
                          branch that is neither behind nor diverged. It runs
                          only planned validation and compares the complete
                          branch with the plan's Objective and Expected
                          Outcome. Concrete gaps return to `/work` as
                          corrective todos. When validation passes, `/ready`
                          pushes if needed, publishes the complete plan to the
                          request, marks it ready for review, and continues to
                          `/inspect` after observing the required updates.

                          `/inspect` reviews one frozen request snapshot and
                          head SHA, publishes each unseen valid finding once,
                          and returns blocking findings to `/work`. Corrected
                          work passes through `/ready` and receives a new
                          inspection snapshot. With no blocking finding it
                          applies `agent-inspected` and stops; merge and
                          `/done` remain human decisions.

                          **Bridge result:** `## Inspect result` is checked by
                          `is-success` for this same item. An incomplete
                          outcome is not reported as completed work.
                        uri: '{{ envs.bridge_url }}/generate'
                        method: POST
                        contentType: application/json
                        headers:
                          Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
                        body: >-
                          {{ {
                            "requestId": execution.id ~ "-work-" ~ uuid(),
                            "prompt": "Execute /work for item " ~ fromJson(fromJson(outputs.next.body).text).id ~ ".",
                            "directory": fromJson(fromJson(outputs.project.body).text).path,
                            "timeoutMs": 3585000
                          } | toJson }}
                        timeout: PT1H
                        options:
                          timeout:
                            connectTimeout: PT5S
                            readIdleTimeout: PT59M55S
                      - id: is-success
                        type: io.kestra.plugin.core.flow.Switch
                        description: |
                          **Classify the `/work` result for the selected item.**
                          The reply must contain a valid `## Inspect result`
                          naming that same item.

                          - **Success:** inspection was published or completed
                            without findings **and** `agent-inspected` was applied.
                          - **Partial:** a valid result reports unfinished work
                            or inspection; retain it for follow-up.
                          - **Error:** the result is missing, malformed, or
                            names a different item; fail visibly.
                        value: >-
                          {{ {
                            "response": fromJson(outputs['work'].body).text,
                            "item": fromJson(fromJson(outputs.next.body).text).id
                          } | toJson | jq('
                            try (
                              (.response | gsub("\r\n?"; "\n") | split("\n")
                                | map(sub("[ \t]+$"; ""))) as $lines
                              | ($lines | index("## Inspect result")) as $start
                              | if $start == null then "error"
                                else $lines[$start:$start + 4] as $result
                                | ($result[2] | capture("^\\*\\*Request \\S.*:\\*\\* (?<status>\\S.*)$") // {}) as $request
                                | ($result[3] | capture("^\\*\\*Item (?:\\[(?<linked>[^]]+)\\]\\([^)]*\\)|(?<plain>\\S+)):\\*\\* (?<status>\\S.*)$") // {}) as $item
                                | ($request.status // "" | sub(" [—–-] \\S.*$"; "")) as $request_status
                                | ($item.status // "" | sub("^`agent-inspected` "; "agent-inspected ")
                                  | sub(" [—–-] \\S.*$"; "")) as $item_status
                                | if $result[1] != ""
                                  or (["inspection published", "inspection completed without findings", "inspection incomplete", "inspection failed", "inspection not attempted", "unobserved"]
                                    | index($request_status)) == null
                                  or (["agent-inspected applied", "agent-inspected not applied", "unobserved"]
                                    | index($item_status)) == null
                                  or ($item.linked // $item.plain // "") != .item then "error"
                                  elif (["inspection published", "inspection completed without findings"]
                                    | index($request_status)) != null
                                    and $item_status == "agent-inspected applied" then "success"
                                  else "partial"
                                  end
                                end
                            ) catch "error"
                          ') | first }}
                        cases:
                          error:
                            - id: work-error
                              type: io.kestra.plugin.core.execution.Fail
                              description: |
                                **Invalid `/work` result.** The reply lacks a
                                valid inspection result for the selected item.
                                Fail this task and include the received text in
                                the error for diagnosis. The enclosing `start`
                                block still allows `sleep` and another cycle.
                              errorMessage: |-
                                Invalid /work response: expected the inspect-result template for the selected item. Received response:
                                {{ fromJson(outputs['work'].body).text | default('No textual response received.') }}
                          partial:
                            - id: work-partial
                              type: io.kestra.plugin.core.execution.Fail
                              description: |
                                **Incomplete `/work` outcome.** The inspection
                                result is valid, but work did not finish with
                                `agent-inspected` applied. Include the returned
                                result in the task log for follow-up, then allow
                                `sleep` and future cycles.
                              allowFailure: true
                              errorMessage: |-
                                Work did not complete successfully. Received response:
                                {{ fromJson(outputs['work'].body).text }}
                          success:
                            - id: work-sucess
                              type: io.kestra.plugin.core.log.Log
                              description: |
                                **Completed item.** Inspection was published or
                                completed without findings, and
                                `agent-inspected` was applied to the selected
                                item. Record success, then continue to `sleep`.
                              message: Work completed successfully; inspection completed and agent-inspected was applied to the selected item.
                    no-project:
                      - id: project-required
                        type: io.kestra.plugin.core.execution.Fail
                        description: |
                          **Repository unresolved.** `/project` returned
                          `not found` or `search incomplete`.

                          - `not found`: configure or create the local project.
                          - `search incomplete`: restore the local search.

                          Do not run `/work` without a verified path. Record
                          the reason, then allow the next cycle after `sleep`.
                        errorMessage: "{{ fromJson(fromJson(outputs.project.body).text).status == 'not found' ? 'No local project was found for this item. Set up or configure the project before running the flow again.' : 'The local project search did not complete. Restore search availability before running the flow again.' }}"
                    error:
                      - id: project-error
                        type: io.kestra.plugin.core.execution.Fail
                        description: |
                          **Invalid `/project` result.** A valid reply contains
                          a nonblank `path` or the documented `not found` /
                          `search incomplete` status. Fail on any other shape;
                          never pass it to `/work` as a working directory.
                          The loop still reaches `sleep` afterward.
                        errorMessage: 'Invalid /project response: expected a nonblank string path or a documented unresolved status without a path.'
              no-item:
                - id: no-item
                  type: io.kestra.plugin.core.log.Log
                  description: |
                    **Nothing to process in this cycle.** `/next` found no
                    eligible item in the provider page it inspected.

                    - Skip `/project` and `/work`.
                    - Log the empty selection; it is **not an error**.
                    - Continue to `sleep`, then check again.
                  level: INFO
                  message: 'no-item: aucun item éligible ; ce cycle se termine sans résolution de projet.'
              error:
                - id: next-error
                  type: io.kestra.plugin.core.execution.Fail
                  description: |
                    **Invalid `/next` result.** The HTTP request succeeded, but
                    its content is neither a complete item nor the exact
                    `no eligible item` status. Fail this attempt visibly. An
                    HTTP failure is recorded by `next` itself; either way,
                    `sleep` still runs before the next cycle.
                  errorMessage: Invalid /next response.
      - id: sleep
        type: io.kestra.plugin.core.flow.Sleep
        description: |
          **Wait after every cycle** before calling `/next` again.

          - **Duration:** `intervalSeconds`, default `300` seconds (five minutes).
          - **Applies after:** completed work, an empty selection, or a failure.
          - **Ordering:** the previous attempt has finished before this wait
            begins; no next item starts during the delay.
        duration: "PT{{ inputs.intervalSeconds }}S"
