id: work
namespace: agent_workflows
description: Select the next eligible item and resolve its local project directory.
tasks:
  - id: next
    type: io.kestra.plugin.core.http.Request
    uri: '{{ envs.bridge_url }}/generate'
    method: POST
    contentType: text/plain
    headers:
      X-Request-Id: '{{ execution.id }}-next'
      Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
    body: 'Execute /next'
    timeout: PT35M
    options:
      timeout:
        connectTimeout: PT5S
        readIdleTimeout: PT35M
  - id: resolve_local_project
    type: io.kestra.plugin.core.http.Request
    runIf: "{{ fromJson(fromJson(outputs.next.body).text).status != 'no eligible item' }}"
    uri: '{{ envs.bridge_url }}/generate'
    method: POST
    contentType: text/plain
    headers:
      X-Request-Id: '{{ execution.id }}-project'
      Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
    body: 'Execute /project with list: {{ fromJson(fromJson(outputs.next.body).text).list }} and item ID: {{ fromJson(fromJson(outputs.next.body).text).id }}'
    timeout: PT35M
    options:
      timeout:
        connectTimeout: PT5S
        readIdleTimeout: PT35M
outputs:
  - id: item
    type: JSON
    value: '{{ fromJson(fromJson(outputs.next.body).text) }}'
  - id: traceUrl
    type: STRING
    value: '{{ fromJson(outputs.next.body).traceUrl }}'
  - id: projectDirectory
    type: STRING
    value: "{{ tasks.resolve_local_project.state != 'SKIPPED' ? (fromJson(fromJson(outputs.resolve_local_project.body).text).path ?? '') : '' }}"
  - id: resolution
    type: JSON
    value: "{{ tasks.resolve_local_project.state != 'SKIPPED' ? fromJson(fromJson(outputs.resolve_local_project.body).text) : fromJson('{}') }}"
  - id: resolutionTraceUrl
    type: STRING
    value: "{{ tasks.resolve_local_project.state != 'SKIPPED' ? fromJson(outputs.resolve_local_project.body).traceUrl : '' }}"
