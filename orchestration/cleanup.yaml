id: cleanup
namespace: agent-workflows
description: |
  This flow cleans up **delivered branches** every hour in UTC. On manual runs,
  `intervalSeconds` sets the lookback from the execution start.
  It defaults to one hour.

  | Step | Execution |
  | --- | --- |
  | 1. Select items | Call `cleanup.ts` to find items completed during the interval. An empty list ends the execution successfully. |
  | 2. Clean | Follow each item's merged PR or MR to its clone on the bridge host. If the delivered branch is checked out in a clean worktree, switch to the default branch and pull with `--ff-only`. Remove the local branch before the remote branch. |
  | 3. Report an error | If selection or cleanup returns an error, log its reason and fail the execution. |
variables:
  activatedAt: "__CLEANUP_ACTIVATED_AT__"
  commandsDirectory: commands
inputs:
  - id: intervalSeconds
    type: INT
    min: 1
    max: 3600
    defaults: 3600
    description: How many seconds before the execution start to consider when running manually.
concurrency:
  limit: 1
  behavior: QUEUE
triggers:
  - id: loop
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "@hourly"
    timezone: Etc/UTC
    recoverMissedSchedules: ALL
tasks:
  - id: select-items
    type: io.kestra.plugin.core.http.Request
    uri: '{{ envs.bridge_url }}/scripts'
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
    body: >-
      {{ {
        "path": vars.commandsDirectory ~ "/cleanup.ts",
        "args": [
          "select",
          "" ~ (trigger.previous ?? (execution.startDate | dateAdd(-1 * inputs.intervalSeconds, "SECONDS"))),
          "" ~ (trigger.date ?? execution.startDate),
          vars.activatedAt
        ]
      } | toJson }}
    timeout: PT5M
  - id: clean
    type: io.kestra.plugin.core.http.Request
    runIf: '{{ (fromJson(fromJson(outputs["select-items"].body).stdout).items ?? []) | length > 0 }}'
    uri: '{{ envs.bridge_url }}/scripts'
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
    body: >-
      {{ {
        "path": vars.commandsDirectory ~ "/cleanup.ts",
        "args": ["clean", fromJson(outputs["select-items"].body).stdout]
      } | toJson }}
    timeout: PT5M
  - id: clean-error
    type: io.kestra.plugin.core.execution.Fail
    runIf: >-
      {{ fromJson(fromJson(outputs["select-items"].body).stdout).error is defined
         or (outputs.clean.body is defined and fromJson(fromJson(outputs.clean.body).stdout).error is defined) }}
    errorMessage: >-
      {{ fromJson(fromJson(outputs["select-items"].body).stdout).error
         ?? fromJson(fromJson(outputs.clean.body).stdout).error }}
