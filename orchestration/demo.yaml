id: demo
namespace: demo
description: Demonstrate a bridge request and its Langfuse trace.
inputs:
  - id: requestId
    type: STRING
    required: true
    description: Correlation ID shown in the result and Langfuse trace. Each execution runs a new inference.
  - id: prompt
    type: STRING
    required: true
    description: The request sent to the selected inference provider.
tasks:
  - id: inference
    type: io.kestra.plugin.core.http.Request
    uri: '{{ envs.bridge_url }}/generate'
    method: POST
    contentType: text/plain
    headers:
      X-Request-Id: '{{ inputs.requestId }}'
      Authorization: "Bearer {{ secret('BRIDGE_TOKEN') }}"
    body: '{{ inputs.prompt }}'
    timeout: PT35M
    options:
      timeout:
        connectTimeout: PT5S
        readIdleTimeout: PT35M
  - id: response
    type: io.kestra.plugin.core.log.Log
    message: '{{ outputs.inference.body }}'
outputs:
  - id: result
    type: JSON
    value: '{{ fromJson(outputs.inference.body) }}'
  - id: traceUrl
    type: STRING
    value: '{{ fromJson(outputs.inference.body).traceUrl }}'
